<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Grid responsivo — repeat, auto-fit, minmax</title>
    <style>
        :root {
            --bg: #0F2C5A;
            --panel: #1A3F7F;
            --code: #081D3D;
            --cyan: #6BD6FA;
            --teal: #52E8CC;
            --yellow: #FFD166;
            --rose: #F4869A;
            --white: #FFFFFF;
            --grey: #C9D6E8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--white);
            font-family: Calibri, "Segoe UI", sans-serif;
            padding: 32px 40px 60px;
        }

        h1 {
            font-family: Cambria, Georgia, serif;
            font-size: 28px;
            margin: 0 0 6px;
        }

        .sub {
            color: var(--grey);
            font-size: 15px;
            margin-bottom: 10px;
            max-width: 800px;
        }

        .tip {
            color: var(--yellow);
            font-size: 13.5px;
            margin-bottom: 22px;
        }

        .codebox {
            background: var(--code);
            border-radius: 10px;
            padding: 18px 20px;
            font-family: "Courier New", monospace;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre;
            overflow-x: auto;
            margin-bottom: 28px;
            max-width: 560px;
        }

        /* ============================================
     O EXEMPLO EM SI: grid responsivo sem media query
     ============================================
     Redimensione a janela do navegador para ver
     as colunas aparecerem e sumirem sozinhas.
  */
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .galeria>div {
            background: var(--panel);
            border-radius: 10px;
            padding: 26px;
            text-align: center;
            font-weight: bold;
            color: var(--cyan);
        }

        footer {
            margin-top: 34px;
            color: var(--grey);
            font-size: 12.5px;
        }
    </style>
</head>

<body>

    <h1>repeat(), auto-fit e minmax()</h1>


    <div class="codebox">.galeria {
        display: grid;
        grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        }</div>

    <div class="galeria">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
        <div>Item 5</div>
        <div>Item 6</div>
        <div>Item 7</div>
        <div>Item 8</div>
    </div>

</body>

</html>
