<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EvenTech - Página de contato">
    <meta name="keywords" content="Eventos, Tecnologia, Desenvolvimento, Contato">
    <meta name="author" content="EvenTech">
    <title>Contato | EvenTech</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <a href="../index.html" aria-label="Voltar para página inicial">
            <img src="../img/logo.png" alt="Logo da EvenTech">
        </a>

        <nav aria-label="Menu principal">
            <ul>
                <li><a href="../index.html">Início</a></li>
                <li><a href="programacao.html">Programação</a></li>
                <li><a href="inscricao.html">Inscrição</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>


    <main id="form-contato">

        <h1>📩 Entre em Contato</h1>

        <p>
            Tem dúvidas, sugestões ou precisa de ajuda?
            Envie uma mensagem para nossa equipe.
        </p>


        <form action="#" method="post" aria-label="Formulário de contato">

            <fieldset class="card_contato">

                <legend>💬 Formulário de Contato</legend>

                <div class="campo">
                    <label for="nome">Nome completo <span>*</span></label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" autocomplete="name"
                        required>
                </div>


                <div class="campo">
                    <label for="email">Email <span>*</span></label>
                    <input type="email" id="email" name="email" placeholder="seu.email@email.com" autocomplete="email"
                        required>
                </div>


                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" autocomplete="tel">
                </div>


                <div class="campo">
                    <label for="assunto">Assunto <span>*</span></label>

                    <select id="assunto" name="assunto" required>
                        <option value="">Selecione um assunto</option>
                        <option value="duvida">Dúvida</option>
                        <option value="sugestao">Sugestão</option>
                        <option value="reclamacao">Reclamação</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>


                <div class="campo">
                    <label for="mensagem">Mensagem <span>*</span></label>

                    <textarea id="mensagem" name="mensagem" rows="5" maxlength="500"
                        placeholder="Digite sua mensagem..." required>
                    </textarea>

                    <small>Máximo de 500 caracteres.</small>
                </div>

            </fieldset>


            <button type="submit">
                Enviar Mensagem
            </button>

            <button type="reset">
                Limpar Formulário
            </button>

        </form>

    </main>


    <footer>
        <hr>
        <p>&copy; 2026 EvenTech. Todos os direitos reservados.</p>
    </footer>


</body>

</html>
