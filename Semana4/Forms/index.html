<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Bolsa Futuro Digital</title>
</head>
<body>
    <form id="formulario-contato">
        
        <label for="nome">Nome:</label>
        <input 
            type="text",
            id="nome",
            name="nome", 
            placeholder="Ex.: João Silva", 
            required
        >

        <label for="telefone">Telefone *:</label>
        <input 
            type="tel",
            id="telefone", 
            name="telefone", 
            placeholder="Ex.: (11) 91234-5678", 
            required
        >

        <label for="email">Email:</label>
        <input 
            type="email", 
            id="email", 
            name="email", 
            placeholder="Ex.: seu.email@dominio.com", 
            required
        >

        <br><br>

        <label for="senha">Senha:</label>
        <input 
            type="password",
            id="senha",
            minlength="8",
            name="senha",
            placeholder="Digite sua senha",
            required
        >

        <label for="confirmar-senha">Confirmar Senha:</label>
        <input 
            type="password",
            id="confirmar-senha",
            name="confirmar-senha",
            minlength="8",
            placeholder="Confirme sua senha",
            required
        >

        <br><br>

        <label for="idade">Idade:</label>
        <input 
            type="number",
            id="idade",
            name="idade",
            min="17",
            max="120",
            placeholder="Digite sua idade",
            required
        >

        <label for="cpf">CPF:</label>
        <input 
            type="text",
            id="cpf",
            name="cpf",
            placeholder="Ex.: 123.456.789-00",
            required
        >

        <label for="data-nascimento">Data de Nascimento:</label>
        <input 
            type="date",
            id="data-nascimento",
            name="data-nascimento",
            required
        >   

        <br><br>
        <br><br>


        <label for="mensagem">Mensagem:</label>
        <textarea 
            id="mensagem",
            name="mensagem", 
            placeholder="Digite sua mensagem aqui...", 
            rows="4",
            required
        >
        </textarea>

        <br><br>
        <br><br>

        <p>Quais você já estudou?</p>
        <label><input type="checkbox" name="estudos" value="HTML"> HTML</label>
        <label><input type="checkbox" name="estudos" value="CSS"> CSS</label>
        <label><input type="checkbox" name="estudos" value="JavaScript"> JavaScript</label>

        <br><br>

        <label for="Trilha">Trilha de Interesse</label>
        <select id="trilha" name="trilha" required>

            <option value="">Selecione uma trilha</option>
            <optgroup label="Front-End">
                <option>HTML/CSS</option>
                <option>JavaScript</option>
            </optgroup>
            <optgroup label="Back-End">
                <option>Node.js</option>
                <option>PHP</option>
            </optgroup>

        </select>
        
        <br><br>
    </form>

    <br><br>
    
    <form id="formulario-nivel">
        <select name="nivel">
            <option value="iniciante">Iniciante</option>
            <option value="avançado">Avançado</option>
        </select>
    </form>

    <br><br>
    <br><br>

    <form id="contador-caracteres">
        <label for="mensagem">Mensagem:</label>
        <textarea 
            id="msg",   
            rows="4",
            maxlength="120",
            placeholder="Digite sua mensagem aqui...", 
            required
        >
        </textarea>

        <br><br>
        <br><br>

        <button type="submit">Enviar</button>
    </form>

    <script src="index.js"></script>
</body>
</html>
